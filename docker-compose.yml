services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datacenterla
      POSTGRES_PASSWORD: datacenterla
      POSTGRES_DB: datacenterla
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacenterla -d datacenterla"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://datacenterla:datacenterla@postgres:5432/datacenterla?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: dev-secret-change-in-production-min-32-chars!!
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Data Center LA <onboarding@resend.dev>}
      # STRIPE_SECRET_KEY: sk_test_...
      # STRIPE_PUBLISHABLE_KEY: pk_test_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: postgres://datacenterla:datacenterla@postgres:5432/datacenterla?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

  shop:
    build:
      context: ./shop
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_DEFAULT_WAREHOUSE_ID: "11111111-1111-1111-1111-111111111001"
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_DEFAULT_WAREHOUSE_ID: "11111111-1111-1111-1111-111111111001"
    depends_on:
      - api

volumes:
  pgdata:
