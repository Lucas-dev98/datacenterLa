services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datacenterla
      POSTGRES_PASSWORD: datacenterla
      POSTGRES_DB: datacenterla
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacenterla -d datacenterla"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
