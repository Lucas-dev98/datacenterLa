name: Staging smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - ".github/workflows/staging.yml"

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config > /dev/null
      - name: Build API image
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml build api
      - name: Start postgres and API
        env:
          JWT_SECRET: ci-staging-jwt-secret-min-32-chars!!
          APP_VERSION: ci-staging
        run: |
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d postgres
          docker compose -f docker-compose.yml -f docker-compose.staging.yml run --rm seed
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d api
      - name: Wait for health endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live >/dev/null && curl -sf http://localhost:8080/health/ready >/dev/null; then
              curl -s http://localhost:8080/health/ready
              exit 0
            fi
            sleep 2
          done
          echo "API health checks failed"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml logs api
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml down -v
