openapi: 3.0.3
info:
  title: Data Center LA API
  version: 1.0.0
  description: REST API for ERP admin, ecommerce shop, and partner integrations.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /auth/login:
    post:
      summary: Admin login
  /auth/me:
    get:
      summary: Current admin user
  /pim/products:
    get:
      summary: List products
  /stock/units:
    get:
      summary: List inventory units
  /purchases/orders:
    get:
      summary: List purchase orders
    post:
      summary: Create purchase order
  /purchases/orders/{id}/receive:
    post:
      summary: Receive PO (simple)
  /purchases/orders/{id}/receive-intake:
    post:
      summary: Receive PO with intake photos (multipart payload + batch_photo_*)
  /stock/intake/advance:
    post:
      summary: Advance unit through intake steps (received → inspecting → identified → available)
  /stock/intake/units/{unit_id}/test-pass:
    post:
      summary: Pass intake bench test with test_photo_* uploads
  /stock/intake/complete:
    post:
      summary: Complete intake and release units to a location
  /sales/customers:
    get:
      summary: List CRM customers
    post:
      summary: Create customer
  /sales/orders:
    get:
      summary: List sales orders
    post:
      summary: Create sales order
  /sales/orders/{id}/confirm:
    post:
      summary: Confirm order and reserve stock
  /sales/orders/{id}/ship:
    post:
      summary: Ship order with photo_{order_item_id} uploads
  /payments/intents:
    post:
      summary: Create payment intent for an order
  /payments/intents/{id}/confirm:
    post:
      summary: Confirm payment intent (mock/stripe)
  /sales/returns:
    get:
      summary: List customer returns
    post:
      summary: Create return with multipart payload + photo_*
  /sales/returns/{id}/approve:
    post:
      summary: Approve customer return
  /sales/returns/{id}/receive:
    post:
      summary: Receive returned goods into stock
  /sales/rma:
    get:
      summary: List RMA cases
    post:
      summary: Create RMA with multipart payload + test_photo_*
  /ecommerce/catalog:
    get:
      summary: Public catalog
  /ecommerce/catalog/{sku_id}:
    get:
      summary: Product detail
  /ecommerce/cart:
    get:
      summary: Get cart by session_id
  /ecommerce/checkout:
    post:
      summary: Checkout cart
